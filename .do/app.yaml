name: nexmart-staging
services:
- name: web
  source_dir: /
  github:
    repo: mystore-stack/nexmart
    branch: staging-digitalocean
  dockerfile_path: Dockerfile
  envs:
  - key: NODE_ENV
    value: production
  - key: PORT
    value: "3000"
  http_port: 3000
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  health_check:
    http_path: /api/health
    initial_delay_seconds: 40
    period_seconds: 30
    timeout_seconds: 10
    success_threshold: 1
    failure_threshold: 3
