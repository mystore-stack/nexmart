# docker-compose.yml - Staging Deployment (Neon PostgreSQL + Cloudinary)
services:
  # ── Application ───────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "3000:3000"
    env_file: .env.staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nexmart
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Queue Worker (Optional - requires Redis) ─────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    command: ["node", "-r", "tsx/register", "src/workers/index.ts"]
    env_file: .env.staging
    restart: unless-stopped
    networks:
      - nexmart
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - with-worker

  # ── Redis (Optional - currently disabled) ────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - with-redis
    networks:
      - nexmart

volumes:
  redis_data:

networks:
  nexmart:
    driver: bridge
